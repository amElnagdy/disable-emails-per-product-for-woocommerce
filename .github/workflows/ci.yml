name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:5.7
        ports:
          - '3306:3306'
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: wordpress_test
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Install WP test scaffolding
        run: bash tests/bin/install-wp-tests.sh wordpress_test root '' 127.0.0.1 latest

      - name: PHP lint
        id: lint
        run: composer run-script lint

      - name: WordPress coding standards (PHPCS)
        if: always()
        run: composer run-script sniff

      - name: PHPUnit regression suite
        if: always()
        run: composer run-script test

      - name: Verify .distignore excludes test artefacts
        if: always()
        run: |
          for path in tests phpunit.xml.dist phpcs.xml.dist .github composer.lock specs; do
            grep -q "^$path/\?$" .distignore || { echo "Missing exclusion: $path"; exit 1; }
          done
